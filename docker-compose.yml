# Optional: API + static web build. PostGIS is deliberately NOT required - the pilot runs from precomputed
# data in data/processed (the "precomputed GeoJSON fallback" from the project pack).
services:
  api:
    image: python:3.12-slim
    working_dir: /repo/backend
    volumes: ["./:/repo:ro"]
    command: sh -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    environment:
      PRITHVI_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173"
  web:
    image: node:22-slim
    working_dir: /repo/frontend
    volumes: ["./:/repo"]
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: "http://127.0.0.1:8000"
